{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You - CallYourMomma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body>

<div class="container text-center py-5">
  <h1 class="display-4 fw-bold text-success mb-4">Thank You!</h1>
  <p class="lead">We've received your order. Here's a summary:</p>

  <div class="card shadow-sm mt-4 mx-auto" style="max-width: 600px;">
    <div class="card-body">
      <ul class="list-group list-group-flush mb-3">
        {% for item in cart_items %}
          <li class="list-group-item d-flex justify-content-between">
            <span>{{ item.product.name }} (x{{ item.quantity }})</span>
            <span>${{ item.total_price|floatformat:2 }}</span>
          </li>
        {% endfor %}
        <li class="list-group-item d-flex justify-content-between fw-bold">
          <span>Total:</span>
          <span>${{ total|floatformat:2 }}</span>
        </li>
      </ul>
      <a href="{% url 'shop' %}" class="btn btn-outline-success w-100">Continue Shopping</a>
    </div>
  </div>
</div>

</body>
</html>
