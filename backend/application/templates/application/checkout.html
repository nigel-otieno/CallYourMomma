{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout - CallYourMomma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body { background-color: #d2c9ff; font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body>

<div class="container mt-5">
  <h2 class="fw-bold text-center mb-4">Checkout</h2>

  <div class="row">
    <div class="col-lg-8">
      <ul class="list-group mb-4">
        {% for item in cart_items %}
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <div>
              <h6 class="mb-1">{{ item.product.name }}</h6>
              <small class="text-muted">Quantity: {{ item.quantity }}</small>
            </div>
            <span class="text-muted">${{ item.total_price|floatformat:2 }}</span>
          </li>
        {% endfor %}
      </ul>
    </div>

    <div class="col-lg-4">
      <div class="card p-4 shadow-sm">
        <h5 class="mb-3">Summary</h5>

        <div class="d-flex justify-content-between mb-2">
          <span>Subtotal:</span>
          <strong>${{ total|floatformat:2 }}</strong>
        </div>

        <div class="d-flex justify-content-between mb-3">
          <span>Shipping:</span>
          <select class="form-select form-select-sm w-50" id="shipping-select">
            <option value="0">Free</option>
            <option value="5">Standard - $5</option>
            <option value="10">Express - $10</option>
          </select>
        </div>

        <hr>

        <div class="d-flex justify-content-between mb-4">
          <span>Total:</span>
          <strong id="total-amount">${{ total|floatformat:2 }}</strong>
        </div>

        <button id="checkout-button" class="btn btn-dark w-100">Pay with Stripe</button>
      </div>
    </div>
  </div>
</div>

<script>
  const baseTotal = parseFloat("{{ total|floatformat:2 }}");
  const stripe = Stripe("{{ stripe_public_key }}");

  document.getElementById("shipping-select").addEventListener("change", function() {
    const shipping = parseFloat(this.value);
    const updatedTotal = (baseTotal + shipping).toFixed(2);
    document.getElementById("total-amount").textContent = `$${updatedTotal}`;
  });

  document.getElementById("checkout-button").addEventListener("click", () => {
    fetch("{% url 'create_checkout_session' %}", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ csrf_token }}"
      },
    })
    .then(res => res.json())
    .then(data => stripe.redirectToCheckout({ sessionId: data.id }));
  });
</script>

</body>
</html>
