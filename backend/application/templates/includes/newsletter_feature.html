{% load static %}
<!-- includes/newsletter_feature.html -->


<section class="py-5" style="background-color: #D98324;">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6">
          <h2 class="fw-bold" style="color: #443627;">
            Get <span style="color: #EFDCAB;">25% Discount</span><br>on your first purchase
          </h2>
          <p class="text-muted">Lorem ipsum dolor sit amet, consectetur adipiscing elit. At tellus ut nunc amet vel egestas.</p>
        </div>
        <div class="col-md-6">
          <form>
            <div class="mb-3">
              <label for="name" class="form-label small">Name</label>
              <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label small">Email</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="subscribe">
              <label class="form-check-label small" for="subscribe">Subscribe to the newsletter</label>
            </div>
            <button type="submit" class="btn btn-dark">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </section>
