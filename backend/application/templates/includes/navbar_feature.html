{% load static %}
{% load socialaccount %}
<!-- includes/navbar_feature.html -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm py-3">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4 text-warning" href="{% url 'home' %}">🌶️ CallYourMomma</a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav gap-2 align-items-center">
            <li class="nav-item">
              <a class="nav-link text-light text-uppercase fw-light" href="{% url 'shop' %}">Shop</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-light text-uppercase fw-light" href="{% url 'home' %}#about">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-light text-uppercase fw-light" href="{% url 'home' %}#contact">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link position-relative text-light" href="{% url 'cart' %}">
                <i class="bi bi-cart fs-5"></i>
              </a>                
            </li>
            {% load cart_tags %}
            <a href="{% url 'cart' %}" class="nav-link position-relative">
              <i class="fas fa-shopping-cart"></i>
              <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                {{ request|cart_item_count }}
              </span>
            </a>

           
        {% if user.is_authenticated %}
          <li class="nav-item"><a class="nav-link text-light" href="{% url 'profile' %}"><i class="bi bi-person-circle fs-5"></i></a></li>
        {% else %}
          <li class="nav-item"><a class="btn btn-sm btn-warning px-3" href="{% provider_login_url 'google' %}"><i class="bi bi-google me-1"></i> Login</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
